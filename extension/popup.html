<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px/1.5 sans-serif;width:300px;margin:0;padding:14px;background:#fff;color:#111}
h1{font-size:17px;margin:0 0 2px}
.sub{color:#666;font-size:12px;margin-bottom:12px}
select,button{width:100%;padding:8px;margin:4px 0;border-radius:8px;border:1px solid #ccc;font-size:14px}
button{background:#f97316;color:#fff;border:none;cursor:pointer;font-weight:600}
button.sec{background:#eee;color:#111}
button:disabled{opacity:.5}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:8px;display:none}
.bar>div{height:100%;background:#f97316;width:0%}
#status{font-size:12px;color:#444;margin-top:8px;min-height:16px}
</style></head><body>
<h1>TruTranslate</h1>
<div class="sub">%100 cihazda çeviri - sunucu yok, hesap yok</div>
<select id="lang">
<option value="tr" selected>Türkçe</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="pt">Português</option><option value="it">Italiano</option><option value="nl">Nederlands</option><option value="pl">Polski</option><option value="cs">Čeština</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="ar">العربية</option><option value="he">עברית</option><option value="fa">فارسی</option><option value="ur">اردو</option><option value="hi">हिन्दी</option><option value="bn">বাংলা</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="mr">मराठी</option><option value="gu">ગુજરાતી</option><option value="zh">中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option><option value="ms">Bahasa Melayu</option><option value="id">Bahasa Indonesia</option><option value="tl">Filipino</option><option value="km">ខ្មែរ</option><option value="my">မြန်မာ</option><option value="bo">བོད་ཡིག</option><option value="kk">Қазақша</option><option value="mn">Монгол</option><option value="ug">ئۇيغۇرچە</option><option value="yue">粵語</option>
</select>
<button id="go">Bu sayfayı çevir</button>
<button id="revert" class="sec">Orijinali göster</button>
<div class="bar" id="bar"><div id="fill"></div></div>
<div id="status"></div>
<script src="popup.js"></script>
</body></html>
